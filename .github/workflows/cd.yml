name: Build and Local CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build-images:
    name: Build ${{ matrix.image }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: sre-agent
            context: .
            dockerfile: sre-agent-backend/sre-agent/Dockerfile
          - image: sre-gateway
            context: sre-agent-backend/sre-gateway
            dockerfile: sre-agent-backend/sre-gateway/Dockerfile
          - image: sre-agent-frontend
            context: sre-agent-frontend
            dockerfile: sre-agent-frontend/Dockerfile
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GIT_COMMIT=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/taxidriver4ever/${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha }}
            ghcr.io/taxidriver4ever/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-local:
    name: Deploy to local kind
    needs:
      - build-images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on:
      - self-hosted
      - linux
      - x64
      - sre-local-deploy
    environment: local-kubernetes
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify deployment tools and context
        env:
          KUBE_CONTEXT: ${{ vars.LOCAL_KUBE_CONTEXT || 'kind-sre-lab' }}
        run: |
          command -v kubectl >/dev/null
          kubectl config get-contexts "${KUBE_CONTEXT}"
          kubectl --context "${KUBE_CONTEXT}" cluster-info

      - name: Deploy immutable images
        env:
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE_REGISTRY: ghcr.io/taxidriver4ever
          KUBE_CONTEXT: ${{ vars.LOCAL_KUBE_CONTEXT || 'kind-sre-lab' }}
        run: bash scripts/deploy-local-k8s.sh
