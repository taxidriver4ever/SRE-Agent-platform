name: Lab commerce scenarios
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  commerce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML
    - name: Build and validate isolated commerce topology
      run: python scripts/ci/lab_commerce_check.py --build
    - name: Upload trace evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: commerce-trace-evidence
        path: .cache/sre-commerce-test-*/traces.json
        include-hidden-files: true
        if-no-files-found: ignore
