# 第三方 Kubernetes MCP Server 的专用身份。ServiceAccount 本身不授予权限。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-mcp-reader
  namespace: sre-lab
---
# 仅授予诊断所需的 get/list/watch；不包含 secrets，也不包含任何写动词。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-mcp-reader
  namespace: sre-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
# RoleBinding 把权限严格限制在 sre-lab，第三方 Server 无法读取其他 Namespace。
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-mcp-reader
  namespace: sre-lab
subjects:
  - kind: ServiceAccount
    name: sre-agent-mcp-reader
    namespace: sre-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-mcp-reader
