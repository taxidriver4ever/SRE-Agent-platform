apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: sre-lab
  labels: {app: payment-service, service: payment-service}
  annotations: {sre.agent/repository: sre-broken-system, sre.agent/git-sha: local-dev}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-service}}
  template:
    metadata:
      labels: {app: payment-service, service: payment-service, version: local-dev}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8083", sre.agent/git-sha: local-dev}
    spec:
      containers:
        - name: payment-service
          image: sre-lab/payment-service:local-dev
          imagePullPolicy: IfNotPresent
          # 较小 old-space 与 K8s memory limit 共同保证 SRE-005 最终产生真实 OOMKilled。
          env: [{name: NODE_OPTIONS, value: "--max-old-space-size=96"}]
          ports: [{name: http, containerPort: 8083}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: payment-service, namespace: sre-lab, labels: {app: payment-service}}
spec:
  selector: {app: payment-service}
  ports: [{name: http, port: 8083, targetPort: http, nodePort: 30083}]
  type: NodePort
