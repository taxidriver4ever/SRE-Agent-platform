apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: sre-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sre-lab
  labels: {app: mysql, service: mysql}
  annotations:
    sre.agent/repository: sre-broken-system
    sre.agent/component: mysql
spec:
  # MySQL 使用 ReadWriteOnce PVC。Recreate 保证旧 Pod 完全退出后再启动新 Pod，
  # 避免默认 RollingUpdate 在单节点 Kind 中让两个 mysqld 同时争用同一数据目录。
  strategy:
    type: Recreate
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata:
      labels: {app: mysql, service: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          # 同时把慢查询写入 FILE 与 mysql.slow_log 表：文件供人工排查，TABLE 供只读 MCP 执行 SELECT 查询。
          # 0.5 秒阈值足以捕获实验故障，又不会把所有健康请求都当作慢查询写入证据库。
          args: ["--slow-query-log=ON", "--long-query-time=0.5", "--performance-schema=ON", "--log-output=TABLE,FILE", "--slow-query-log-file=/var/lib/mysql/slow.log"]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-credentials, key: root-password}}
          ports: [{name: mysql, containerPort: 3306}]
          readinessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"]}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mysql-data}
        - name: init
          configMap: {name: mysql-init}
---
apiVersion: v1
kind: Service
metadata: {name: mysql, namespace: sre-lab, labels: {app: mysql}}
spec:
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql, nodePort: 30306}]
  type: NodePort
