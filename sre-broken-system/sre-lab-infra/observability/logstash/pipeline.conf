input {
  beats { port => "${LOGSTASH_BEATS_PORT:5044}" ecs_compatibility => disabled }
  http {
    port => "${LOGSTASH_HTTP_PORT:8080}"
    codec => json
    ecs_compatibility => disabled
    max_content_length => 1048576
  }
}
filter {
  if ![app] and [message] =~ /^\{/ {
    json { source => "message" target => "app" }
  }
  if ![app] and ![record_type] {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
      target => "nginx"
      tag_on_failure => ["unparsed_log"]
    }
  }
  ruby { path => "/usr/share/logstash/pipeline/normalize.rb" }
  if "_rubyexception" in [tags] { drop {} }
}
output {
  if [@metadata][route] == "history" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
      user => "${ELASTICSEARCH_USERNAME:}"
      password => "${ELASTICSEARCH_PASSWORD:}"
      index => "${ELASTICSEARCH_HISTORY_INDEX:sre-agent-history-v1}"
      document_id => "%{history_id}"
      data_stream => false
      template => "/usr/share/logstash/templates/history-template.json"
      template_name => "sre-agent-history"
      template_api => composable
      ecs_compatibility => disabled
    }
  } else if [@metadata][route] == "event" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
      user => "${ELASTICSEARCH_USERNAME:}"
      password => "${ELASTICSEARCH_PASSWORD:}"
      index => "${ELASTICSEARCH_EVENT_INDEX:sre-agent-events}-%{+yyyy.MM.dd}"
      document_id => "%{event_id}"
      data_stream => false
      template => "/usr/share/logstash/templates/event-template.json"
      template_name => "sre-agent-events"
      template_api => composable
      ecs_compatibility => disabled
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
      user => "${ELASTICSEARCH_USERNAME:}"
      password => "${ELASTICSEARCH_PASSWORD:}"
      index => "${ELASTICSEARCH_LOG_PREFIX:sre-logs}-%{+yyyy.MM.dd}"
      data_stream => false
      template => "/usr/share/logstash/templates/log-template.json"
      template_name => "sre-logs"
      template_api => composable
      ecs_compatibility => disabled
    }
  }
}
