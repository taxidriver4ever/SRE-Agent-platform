global:
  scrape_interval: 5s
scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service:8080]
        labels: {service: order-service}
  - job_name: inventory-service
    static_configs:
      - targets: [inventory-service:8081]
        labels: {service: inventory-service}
  - job_name: user-service
    metrics_path: /metrics/
    static_configs:
      - targets: [user-service:8082]
        labels: {service: user-service}
  - job_name: payment-service
    static_configs:
      - targets: [payment-service:8083]
        labels: {service: payment-service}
  - job_name: notification-service
    static_configs:
      - targets: [notification-service:8084]
        labels: {service: notification-service}
  - job_name: recommendation-service
    metrics_path: /metrics/
    static_configs:
      - targets: [recommendation-service:8085]
        labels: {service: recommendation-service}
