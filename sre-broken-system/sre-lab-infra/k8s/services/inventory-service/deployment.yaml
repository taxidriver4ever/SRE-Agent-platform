apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: sre-lab
  labels: {app: inventory-service, service: inventory-service}
  annotations: {sre.agent/repository: inventory-service, sre.agent/git-sha: 21ca3f0e4d51483ff9f5f387a037708620a1a6e9}
spec:
  replicas: 2
  selector: {matchLabels: {app: inventory-service}}
  template:
    metadata:
      labels: {app: inventory-service, service: inventory-service, version: 21ca3f0e4d51483ff9f5f387a037708620a1a6e9}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8081", sre.agent/repository: inventory-service, sre.agent/git-sha: 21ca3f0e4d51483ff9f5f387a037708620a1a6e9}
    spec:
      containers:
        - name: inventory-service
          image: sre-lab/inventory-service:21ca3f0e4d51483ff9f5f387a037708620a1a6e9
          env:
            - {name: SERVICE_VERSION, value: 21ca3f0e4d51483ff9f5f387a037708620a1a6e9}
            - {name: RECOMMENDATION_BASE_URL, value: "http://recommendation-service:8085"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          ports: [{name: http, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 48Mi}, limits: {cpu: 600m, memory: 160Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: inventory-service, namespace: sre-lab}
spec: {selector: {app: inventory-service}, ports: [{name: http, port: 8081, targetPort: http}]}
