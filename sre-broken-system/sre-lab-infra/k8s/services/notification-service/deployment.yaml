apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: sre-lab
  labels: {app: notification-service, service: notification-service}
  annotations: {sre.agent/repository: notification-service, sre.agent/git-sha: 670879a11d609d88863a6e6fb83e1cee1b15b6f8}
spec:
  replicas: 2
  selector: {matchLabels: {app: notification-service}}
  template:
    metadata:
      labels: {app: notification-service, service: notification-service, version: 670879a11d609d88863a6e6fb83e1cee1b15b6f8}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8084", sre.agent/repository: notification-service, sre.agent/git-sha: 670879a11d609d88863a6e6fb83e1cee1b15b6f8}
    spec:
      containers:
        - name: notification-service
          image: sre-lab/notification-service:670879a11d609d88863a6e6fb83e1cee1b15b6f8
          env:
            - {name: SERVICE_VERSION, value: 670879a11d609d88863a6e6fb83e1cee1b15b6f8}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          ports: [{name: http, containerPort: 8084}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 30m, memory: 48Mi}, limits: {cpu: 400m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: notification-service, namespace: sre-lab}
spec: {selector: {app: notification-service}, ports: [{name: http, port: 8084, targetPort: http}]}
