apiVersion: v1
kind: ServiceAccount
metadata: {name: observability, namespace: sre-lab}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: sre-lab-observability-readonly}
rules:
  - apiGroups: [""]
    # nodes/metrics 是通过 API Server 代理读取 kubelet/cAdvisor 指标所需的子资源。
    # 权限只有 get/list/watch，不授予 create/update/delete，保证观测组件保持只读。
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sre-lab-observability-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sre-lab-observability-readonly}
subjects: [{kind: ServiceAccount, name: observability, namespace: sre-lab}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: sre-lab, labels: {app: prometheus}}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus, service: prometheus}}
    spec:
      serviceAccountName: observability
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=24h"]
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: sre-lab}
spec: {selector: {app: prometheus}, type: NodePort, ports: [{name: http, port: 9090, targetPort: http, nodePort: 30090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: sre-lab, labels: {app: loki}}
spec:
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki, service: loki}}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.5.1
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{name: http, containerPort: 3100}]
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
          volumeMounts: [{name: config, mountPath: /etc/loki}]
      volumes: [{name: config, configMap: {name: loki-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: sre-lab}
spec: {selector: {app: loki}, type: NodePort, ports: [{name: http, port: 3100, targetPort: http, nodePort: 30100}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tempo, namespace: sre-lab, labels: {app: tempo}}
spec:
  replicas: 1
  selector: {matchLabels: {app: tempo}}
  template:
    metadata: {labels: {app: tempo, service: tempo}}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.8.1
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports: [{name: query, containerPort: 3200}, {name: otlp-grpc, containerPort: 4317}, {name: otlp-http, containerPort: 4318}]
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
          volumeMounts: [{name: config, mountPath: /etc/tempo}]
      volumes: [{name: config, configMap: {name: tempo-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: tempo, namespace: sre-lab}
spec:
  selector: {app: tempo}
  type: NodePort
  ports:
    - {name: query, port: 3200, targetPort: query, nodePort: 30200}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: sre-lab, labels: {app: otel-collector}}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector, service: otel-collector}}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.130.1
          args: ["--config=/etc/otel/otel-collector.yaml"]
          ports: [{name: grpc, containerPort: 4317}, {name: http, containerPort: 4318}, {name: health, containerPort: 13133}]
          # health_check 扩展只有在完整 pipeline 配置成功加载后才监听 13133。
          # 探针可阻止 Collector 启动后立即崩溃却被 rollout 短暂视为成功的假阳性。
          readinessProbe: {httpGet: {path: /, port: health}, initialDelaySeconds: 3, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /, port: health}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts: [{name: config, mountPath: /etc/otel}]
      volumes: [{name: config, configMap: {name: otel-collector-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: sre-lab}
spec:
  selector: {app: otel-collector}
  ports: [{name: grpc, port: 4317, targetPort: grpc}, {name: http, port: 4318, targetPort: http}, {name: health, port: 13133, targetPort: health}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: sre-lab, labels: {app: kube-state-metrics}}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: observability
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
          ports: [{name: http, containerPort: 8080}]
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: sre-lab}
spec: {selector: {app: kube-state-metrics}, ports: [{name: http, port: 8080, targetPort: http}]}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: alloy, namespace: sre-lab, labels: {app: alloy}}
spec:
  # 容器至少稳定运行 5 秒才算 Available，避免“启动后立即崩溃”骗过 rollout status。
  minReadySeconds: 5
  selector: {matchLabels: {app: alloy}}
  template:
    metadata: {labels: {app: alloy, service: alloy}}
    spec:
      serviceAccountName: observability
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.0
          args: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 300m, memory: 256Mi}}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
      volumes:
        - name: config
          configMap: {name: alloy-config}
        - name: pod-logs
          hostPath: {path: /var/log/pods}
