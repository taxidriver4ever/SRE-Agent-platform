admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
static_resources:
  listeners:
  - name: commerce
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: lab
          generate_request_id: true
          always_set_request_id_in_response: true
          tracing:
            provider:
              name: envoy.tracers.opentelemetry
              typed_config:
                '@type': type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                grpc_service:
                  envoy_grpc:
                    cluster_name: otel
                  timeout: 0.5s
                service_name: envoy-gateway
            random_sampling:
              value: 100
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  timestamp: '%START_TIME%'
                  service: envoy-gateway
                  environment: lab
                  trace_id: '%TRACE_ID%'
                  request_id: '%REQ(X-REQUEST-ID)%'
                  endpoint: '%REQ(:PATH)%'
                  status: '%RESPONSE_CODE%'
                  latency_ms: '%DURATION%'
                  response_flags: '%RESPONSE_FLAGS%'
          route_config:
            name: lab
            virtual_hosts:
            - name: commerce
              domains:
              - '*'
              routes:
              - match:
                  path_separated_prefix: /api/orders
                route:
                  cluster: order-service
                  regex_rewrite:
                    pattern:
                      regex: ^/api/
                    substitution: /
                  timeout: 5s
              - match:
                  path_separated_prefix: /api/users
                route:
                  cluster: user-service
                  regex_rewrite:
                    pattern:
                      regex: ^/api/
                    substitution: /
                  timeout: 5s
              - match:
                  path_separated_prefix: /api/recommendations
                route:
                  cluster: recommendation-service
                  regex_rewrite:
                    pattern:
                      regex: ^/api/
                    substitution: /
                  timeout: 5s
          http_filters:
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: lab_rate_limit
              token_bucket:
                max_tokens: 50
                tokens_per_fill: 50
                fill_interval: 1s
              filter_enabled:
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                default_value:
                  numerator: 100
                  denominator: HUNDRED
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: REJECT_REQUEST
          request_id_extension:
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
              pack_trace_reason: false
              use_request_id_for_trace_sampling: false
  clusters:
  - name: order-service
    connect_timeout: 0.2s
    type: STRICT_DNS
    load_assignment:
      cluster_name: order-service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: order-service
                port_value: 8080
  - name: user-service
    connect_timeout: 0.2s
    type: STRICT_DNS
    load_assignment:
      cluster_name: user-service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: user-service
                port_value: 8082
  - name: recommendation-service
    connect_timeout: 0.2s
    type: STRICT_DNS
    load_assignment:
      cluster_name: recommendation-service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: recommendation-service
                port_value: 8085
  - name: otel
    connect_timeout: 0.2s
    type: STRICT_DNS
    load_assignment:
      cluster_name: otel
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: otel-collector
                port_value: 4317
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
