apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-gateway
  namespace: sre
  labels:
    app.kubernetes.io/name: sre-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: sre-agent-platform
    app.kubernetes.io/version: "VERSION_PLACEHOLDER"
  annotations:
    sre.agent/git-commit: "GIT_SHA_PLACEHOLDER"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: sre-agent-platform
        app.kubernetes.io/version: "VERSION_PLACEHOLDER"
      annotations:
        sre.agent/git-commit: "GIT_SHA_PLACEHOLDER"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sre-gateway
          image: ghcr.io/taxidriver4ever/sre-gateway:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sre-gateway-config
            - secretRef:
                name: sre-gateway-secrets
          env:
            - name: APP_VERSION
              value: "IMAGE_TAG_PLACEHOLDER"
            - name: GIT_COMMIT
              value: "GIT_SHA_PLACEHOLDER"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
