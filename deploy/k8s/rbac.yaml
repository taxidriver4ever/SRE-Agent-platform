apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-runtime
  namespace: sre
automountServiceAccountToken: true
---
# The Agent runs in namespace sre but diagnoses the existing sre-lab namespace.
# This Role remains read-only and deliberately excludes Secrets and write verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-runtime-reader
  namespace: sre-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-runtime-reader
  namespace: sre-lab
subjects:
  - kind: ServiceAccount
    name: sre-agent-runtime
    namespace: sre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-runtime-reader
