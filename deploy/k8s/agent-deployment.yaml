apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent
  namespace: sre
  labels:
    app.kubernetes.io/name: sre-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: sre-agent-platform
    app.kubernetes.io/version: "VERSION_PLACEHOLDER"
  annotations:
    sre.agent/git-commit: "GIT_SHA_PLACEHOLDER"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 240
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: sre-agent-platform
        app.kubernetes.io/version: "VERSION_PLACEHOLDER"
      annotations:
        sre.agent/git-commit: "GIT_SHA_PLACEHOLDER"
    spec:
      serviceAccountName: sre-agent-runtime
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sre-agent
          image: ghcr.io/taxidriver4ever/sre-agent:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: sre-agent-config
            - secretRef:
                name: sre-agent-secrets
          env:
            - name: APP_VERSION
              value: "IMAGE_TAG_PLACEHOLDER"
            - name: GIT_COMMIT
              value: "GIT_SHA_PLACEHOLDER"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/sre-agent
            - name: npm-cache
              mountPath: /home/sre/.npm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
