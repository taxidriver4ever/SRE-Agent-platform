apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-agent-config
  namespace: sre
data:
  GATEWAY_BASE_URL: http://sre-gateway.sre.svc.cluster.local:8000
  GATEWAY_MODEL: vllm/qwen3-4b
  GATEWAY_TIMEOUT_SECONDS: "180"
  GATEWAY_MAX_TOKENS: "512"
  KUBERNETES_NAMESPACE: sre-lab
  PROMETHEUS_BASE_URL: http://prometheus.sre-lab.svc.cluster.local:9090
  LOKI_BASE_URL: http://loki.sre-lab.svc.cluster.local:3100
  TEMPO_BASE_URL: http://tempo.sre-lab.svc.cluster.local:3200
  MYSQL_HOST: mysql.sre-lab.svc.cluster.local
  MYSQL_PORT: "3306"
  MYSQL_USER: sre_reader
  MYSQL_DATABASE: sre_lab
  APPLICATION_MYSQL_HOST: host.docker.internal
  APPLICATION_MYSQL_PORT: "13308"
  APPLICATION_MYSQL_USER: sre_agent
  APPLICATION_MYSQL_DATABASE: sre_agent
  SERVICE_CATALOG_PATH: /opt/sre-broken-system/sre-lab-infra/service-catalog.yaml
  SRE_REPOSITORY_PATH: /opt/sre-broken-system
  SRE_REPOSITORY_CACHE_PATH: /var/lib/sre-agent/repositories
  SRE_REPOSITORY_ALLOWED_HOSTS: github.com,gitlab.com,bitbucket.org
  SRE_TOOL_POLICY_PATH: /app/config/tool-policy.yaml
  SRE_DEFAULT_PROJECT_ID: sre-lab
  SRE_SANDBOX_WORKSPACE_ROOT: /var/lib/sre-agent/sandbox
  SRE_VALIDATION_WORKSPACE_ROOT: /var/lib/sre-agent/validation
  SRE_VALIDATION_ARTIFACT_ROOT: /var/lib/sre-agent/artifacts
  SRE_NPM_CACHE: /home/sre/.npm
  KUBERNETES_MCP_COMMAND: npx
  DIAGNOSIS_DEADLINE_SECONDS: "240"
  DIAGNOSIS_LEASE_TTL_SECONDS: "60"
  DIAGNOSIS_HEARTBEAT_INTERVAL_SECONDS: "10"
  DIAGNOSIS_RECOVERY_SCAN_INTERVAL_SECONDS: "15"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-gateway-config
  namespace: sre
data:
  GATEWAY_MYSQL_HOST: host.docker.internal
  GATEWAY_MYSQL_PORT: "13308"
  GATEWAY_MYSQL_USER: sre_agent
  GATEWAY_MYSQL_DATABASE: sre_agent
  VLLM_BASE_URL: http://host.docker.internal:18000/v1
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  PROVIDER_TIMEOUT_SECONDS: "180"
