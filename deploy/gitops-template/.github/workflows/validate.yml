name: GitOps desired state
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  helm:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3
      - name: Lint and render approved desired state
        env:
          TARGET_ENV: ${{ matrix.environment }}
        run: |
          helm lint charts/sre-platform -f "environments/$TARGET_ENV/values.yaml" --strict
          helm template sre-platform charts/sre-platform -n "sre-$TARGET_ENV" -f "environments/$TARGET_ENV/values.yaml" > rendered.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-${{ matrix.environment }}
          path: rendered.yaml
  lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.17.3
      - run: python -m pip install PyYAML==6.0.2
      - id: release
        name: Detect explicit bootstrap state
        run: |
          python - <<'PY'
          import os, yaml
          with open('environments/dev/lab-values.yaml') as f:
              values = yaml.safe_load(f)
          ready = values.get('releaseReady')
          assert isinstance(ready, bool), 'releaseReady must be explicit'
          if not ready:
              assert all(not any(s['image'].values()) for s in values['services'].values()), 'partial release is invalid'
              print('Lab not initialized: register Application only after all six images are published')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ready=' + str(ready).lower() + '\n')
          PY
      - name: Validate complete Lab desired state
        if: steps.release.outputs.ready == 'true'
        run: |
          helm lint charts/sre-lab -f environments/dev/lab-values.yaml --strict
          helm template sre-lab charts/sre-lab -n sre-lab -f environments/dev/lab-values.yaml > rendered-lab.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.release.outputs.ready == 'true'
        with:
          name: rendered-lab-dev
          path: rendered-lab.yaml
          if-no-files-found: error
